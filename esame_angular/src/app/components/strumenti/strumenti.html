<div class="pannello p-3 mb-3">
    <div class="d-flex flex-wrap align-items-center gap-2">
        <span class="fw-semibold me-2">Aggiungi dispositivo:</span>

        <button class="btn btn-outline-primary" (click)="service.aggiungiDispositivo('PC')">
            <i class="bi bi-pc-display me-1"></i>PC
        </button>

        <button class="btn btn-outline-success" (click)="service.aggiungiDispositivo('Switch')">
            <i class="bi bi-hdd-network me-1"></i>Switch
        </button>

        <button class="btn btn-outline-warning" (click)="service.aggiungiDispositivo('Router')">
            <i class="bi bi-router me-1"></i>Router
        </button>
    </div>

    <hr class="my-3" />

    <div class="d-flex flex-wrap align-items-center gap-2">
        <span class="fw-semibold me-2">Modalità:</span>

        <div class="btn-group" role="group" aria-label="Modalità del canvas">
            <button
                type="button"
                class="btn btn-outline-secondary"
                [class.active]="service.modalita() == 'edit'"
                [attr.aria-pressed]="service.modalita() == 'edit'"
                (click)="service.cambiaModalita('edit')"
            >
                <i class="bi bi-pencil-square me-1"></i>Modifica
            </button>

            <button
                type="button"
                class="btn btn-outline-secondary"
                [class.active]="service.modalita() == 'connect'"
                [attr.aria-pressed]="service.modalita() == 'connect'"
                (click)="service.cambiaModalita('connect')"
            >
                <i class="bi bi-link-45deg me-1"></i>Collegamento
            </button>
        </div>

        @if (service.selezionato() == null) {
        <span class="text-muted small">In modalità modifica trascini i dispositivi, in collegamento ne unisci due con un click.</span>
        } @else {
        <span class="text-muted small">Sorgente selezionata: clicca un altro dispositivo per collegarlo.</span>
        }
    </div>

    <hr class="my-3" />

    <div class="d-flex flex-wrap align-items-center gap-2">
        <span class="fw-semibold me-2">Topologia:</span>

        <button
            type="button"
            class="btn btn-outline-primary"
            (click)="service.salvaTopologia()"
        >
            <i class="bi bi-floppy me-1"></i>Salva
        </button>

        <button
            type="button"
            class="btn btn-outline-primary"
            (click)="service.caricaTopologia()"
        >
            <i class="bi bi-folder2-open me-1"></i>Carica
        </button>

        <button
            type="button"
            class="btn btn-outline-danger"
            (click)="service.cancellaTopologia()"
        >
            <i class="bi bi-trash me-1"></i>Cancella
        </button>

        <span class="text-muted small">Salva e carica usano il Local Storage del browser.</span>
    </div>
</div>
